version: "2"
services:
  web:
    build: .
    ports:
      - "7001:7001"
    links:
      - mongo
    environment:
      MONGO_URI: mongodb://localhost:27017/query-server
  mongo:
    image: mongo:latest@sha256:5211c51171f57ae60842b11664bb244628971b3d35325762a97888337b9bb0db
    volumes:
      - /data/mongodb/db:/data/db
    ports:
      - "27017:27017"
